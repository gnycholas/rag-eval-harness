name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      # No network and no API key: tests run on the stub provider against
      # fixtures cut from the real dataset. A suite that needs either would be
      # flaky, and a flaky suite teaches everyone to ignore red.
      - name: Tests
        run: pytest -q
